name: Check pages

on:
  pull_request:
    branches: [master, release/v3.0.0, preview/synth-city]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site (Astro output plus unchanged docs/)
        run: npm run build

      - name: Check built pages and local links
        run: python3 scripts/check-pages.py dist

      - name: Negative checks for the page checker
        run: python3 scripts/test-check-pages.py
